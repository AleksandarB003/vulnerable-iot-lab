version: "3.8"

services:
  vulnerable-mosquitto:
    image: eclipse-mosquitto:2
    container_name: vulnerable-mosquitto
    profiles: ["vulnerable"]
    ports:
      - "1884:1883"
    volumes:
      - ./vulnerable-broker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  vulnerable-server:
    build: ./vulnerable-broker/server
    container_name: vulnerable-server
    profiles: ["vulnerable"]
    ports:
      - "3001:3000"
    depends_on:
      - vulnerable-mosquitto
    environment:
      - MQTT_BROKER_URL=mqtt://vulnerable-mosquitto:1883
    volumes:
      - vulnerable-server-data:/app/data

  vulnerable-device-sim:
    build: ./vulnerable-broker/device-sim
    container_name: vulnerable-device-sim
    profiles: ["vulnerable"]
    depends_on:
      - vulnerable-mosquitto
    environment:
      - MQTT_BROKER_URL=mqtt://vulnerable-mosquitto:1883
      - DEVICE_IDS=${DEVICE_IDS:-sensor-livingroom,sensor-garage,thermostat-bedroom}

  secure-mosquitto:
    image: eclipse-mosquitto:2
    container_name: secure-mosquitto
    profiles: ["secure"]
    ports:
      - "1885:1883"
    volumes:
      - ./secure-broker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  secure-server:
    build: ./secure-broker/server
    container_name: secure-server
    profiles: ["secure"]
    ports:
      - "3002:3000"
    depends_on:
      - secure-mosquitto
    environment:
      - MQTT_BROKER_URL=mqtt://secure-mosquitto:1883
    volumes:
      - ./exploits:/app/exploits:ro
      - secure-server-data:/app/data

  secure-device-sim:
    build: ./secure-broker/device-sim
    container_name: secure-device-sim
    profiles: ["secure"]
    depends_on:
      - secure-mosquitto
    environment:
      - MQTT_BROKER_URL=mqtt://secure-mosquitto:1883
      - DEVICE_IDS=${DEVICE_IDS:-sensor-livingroom,sensor-garage,thermostat-bedroom}
    
    
    
volumes:
      vulnerable-server-data:
      secure-server-data: